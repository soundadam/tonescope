name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cpal 链接 ALSA；eframe 的 winit 后端要 xcb / xkbcommon 头文件
      - run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # 与 CLAUDE.md 的本地门槛一致
      - run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
